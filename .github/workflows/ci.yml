# CI gate: unit + invariant + RLS tests all have to pass to merge.
#
# This sat inert from Phase 0 until the repository extraction (ADR 0017), because
# GitHub reads workflows only from a repository root and this project lived in a
# subdirectory. Its first real run failed before reaching any of the steps below,
# on a pnpm version specified in two places — which is the argument for running a
# gate rather than admiring it.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recouple_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/recouple_test

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. `packageManager` in package.json pins the
      # exact pnpm build, and the action refuses to be told twice — specifying
      # both fails the run before a line of this project's code executes.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      # Applies the migrations, which the Postgres integration tests then run
      # against — so this has to come before `pnpm test`.
      - name: database invariants (approval gate, append-only, RLS)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pnpm db:test

      - name: unit, property and integration tests
        run: pnpm test

      # Replays committed cassettes. Calls no model and spends nothing.
      - name: extraction evals (no regression beyond tolerance)
        run: pnpm eval

      # The app's own build: a route that does not compile is a page nobody can
      # open. It needs no secrets — configuration is read per request, so a
      # missing value fails loudly at the first request rather than at build.
      - name: web app builds
        run: pnpm build:web
