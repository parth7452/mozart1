<!doctype html><html><body><p>Statement</p>
<script>
// A frame that writes as it goes away, removed by the page that holds it.
var frame = document.createElement('iframe');
frame.src = '/beacon-frame.html';
frame.onload = function () { setTimeout(function () { frame.remove(); }, 200); };
document.body.appendChild(frame);
setTimeout(function () { document.body.setAttribute('data-done', '1'); }, 2000);
</script>
</body></html>
